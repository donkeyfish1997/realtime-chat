version: '3.8'
services:  
  backend:
    image: <DOCKER_HUB_USERNAME>/chat_backend:latest
    volumes: [] 
    container_name: chat_backend
    ports:
      - "3000:3000"
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      - chat_websocket
      - mysql
      - redis
      - rabbitmq

  chat_websocket:
    image: <DOCKER_HUB_USERNAME>/chat_websocket:latest
    volumes: []
    restart: always
    container_name: chat_websocket
    environment:
      JWT_SECRET: ${JWT_SECRET}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      - rabbitmq

  frontend:
    container_name: chat_frontend
    image: <DOCKER_HUB_USERNAME>/chat_frontend:latest
    volumes: []
    ports:
      - "80:80"
    restart: always
    
  mysql:
    image: mysql:8
    container_name: chat_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:  
      - mysql_data:/var/lib/mysql  # 這個要怎麼儲存？
    ports:
      - "3306:3306"
    
  redis:
    ports:
    - "6379:6379"
    - "8001:8001"
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD} --appendonly yes

  rabbitmq:
    image: rabbitmq:3-management
    container_name: chat_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672" 
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

# 保持 Volumes 定義不變
volumes:
  redis_data:
  mysql_data: