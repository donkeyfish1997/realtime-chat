services:
  backend:
    build: ./backend
    container_name: chat_backend
    ports:
      - "3000:3000" 
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./backend:/usr/src/app
    depends_on:
      - mysql
      - redis
      - rabbitmq
  frontend:
    build: 
      context: ./frontend
      dockerfile: dev.Dockerfile # 👈 指定使用 dev.dockerfile
    container_name: chat_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules  # 不要分享 docker bug
    ports:
      - "5173:5173" 
    command: npm run dev -- --host 0.0.0.0

  mysql:
    image: mysql:8
    container_name: chat_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"

  redis:
    image: redis/redis-stack:latest
    container_name: chat_redis
    restart: always
    ports:
      - "6379:6379"
      - "8001:8001"
    environment:
      - REDIS_ARGS=--requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data 


  rabbitmq:
    image: rabbitmq:3-management
    container_name: chat_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672" 
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

volumes:
  redis_data:
  mysql_data:
