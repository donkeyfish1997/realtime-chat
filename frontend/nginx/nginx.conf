server {
    listen 80;
    server_name localhost;

    # 設置網頁文件的根目錄
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # 1. 嘗試尋找客戶端請求的檔案或目錄 ($uri $uri/)
        # 2. 如果找不到，則將請求導向到 index.html
        try_files $uri $uri/ /index.html;
    }

    # 您可能需要一個用於後端 API 的反向代理 (Reverse Proxy)
    # 假設您的後端服務運行在內部網路名稱 'backend' 的 3000 端口
    # 如果您的前端是純靜態且只調用外部API，則不需要此段。
    # location /api/ {
    #     proxy_pass http://backend:3000/;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    # }
}